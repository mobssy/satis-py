name: Daily News Bot

on:
  schedule:
    # GitHub cron은 UTC만 지원하므로 뉴욕 정오에 해당하는 두 시각을 모두 등록하고,
    # 아래 "Check New York noon" 단계에서 현재 서머타임 여부에 맞는 쪽만 실행한다.
    - cron: "0 16 * * *" # EDT (UTC-4)
    - cron: "0 17 * * *" # EST (UTC-5)
  workflow_dispatch:

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      # 실행이 지연돼도 판정이 바뀌지 않도록 현재 시각이 아니라 트리거된 cron으로 판단한다.
      - name: Check New York noon
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          TRIGGER_CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(TZ=America/New_York date +%z)" = "-0400" ]; then
            expected="0 16 * * *"
          else
            expected="0 17 * * *"
          fi
          if [ "$TRIGGER_CRON" = "$expected" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: '$TRIGGER_CRON' is not New York noon today"
          fi

  run-news-bot:
    needs: check-schedule
    if: needs.check-schedule.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 워크플로우 실행마다 새 체크아웃이라 로컬 파일이 남지 않으므로
      # 전송 이력(sent_history.json)을 캐시로 실행 간에 이어붙인다.
      - name: Restore sent article history
        uses: actions/cache@v4
        with:
          path: sent_history.json
          key: sent-history-${{ github.run_id }}
          restore-keys: |
            sent-history-

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
