name: Daily News Bot

on:
  schedule:
    # 뉴욕 오후 12시 기준 (DST 자동 적용 불가 — 수동 전환 필요)
    # EDT (3월~11월, UTC-4): 0 16 * * *  ← 현재 적용
    # EST (11월~3월, UTC-5): 0 17 * * *  ← 겨울에 이 줄로 교체
    - cron: "0 16 * * *"
  workflow_dispatch:

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 워크플로우 실행마다 새 체크아웃이라 로컬 파일이 남지 않으므로
      # 전송 이력(sent_history.json)을 캐시로 실행 간에 이어붙인다.
      - name: Restore sent article history
        uses: actions/cache@v4
        with:
          path: sent_history.json
          key: sent-history-${{ github.run_id }}
          restore-keys: |
            sent-history-

      - name: Run news bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py
